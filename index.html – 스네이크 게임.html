<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>스네이크 게임</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121922;
    --line: #1c2733;
    --green: #39ff88;
    --green-dark: #1fae5a;
    --red: #ff4d6d;
    --text: #e6edf3;
    --muted: #7d8b99;
    /* 화면 크기에 맞춘 게임판 크기 (가로·세로 모두 고려) */
    --board: min(94vw, calc(100vh - 300px), 560px);
    --board: min(94vw, calc(100dvh - 300px), 560px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #15202c 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: max(10px, env(safe-area-inset-top)) 8px max(10px, env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  .app {
    width: var(--board);
    min-width: 280px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* 상단 점수 영역 */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  h1 {
    margin: 0;
    font-size: clamp(16px, 4.5vw, 22px);
    letter-spacing: 2px;
    color: var(--green);
    text-shadow: 0 0 10px rgba(57,255,136,.55);
    font-family: "Courier New", monospace;
  }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 12px;
    text-align: center;
    min-width: 64px;
  }
  .score-box small { display: block; font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  .score-box b { font-size: clamp(16px, 4.5vw, 20px); font-family: "Courier New", monospace; color: var(--text); }
  #score { color: var(--green); }

  /* 게임판 */
  .board-wrap {
    position: relative;
    width: var(--board);
    min-width: 280px;
    aspect-ratio: 1 / 1;
    border: 2px solid var(--green-dark);
    border-radius: 10px;
    box-shadow: 0 0 22px rgba(57,255,136,.25), inset 0 0 20px rgba(0,0,0,.6);
    overflow: hidden;
    background: #070a0e;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    background: rgba(5, 8, 12, .72);
    text-align: center;
    padding: 12px;
    transition: opacity .15s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay .title { font-size: clamp(22px, 7vw, 34px); font-weight: 800; color: var(--green); text-shadow: 0 0 12px rgba(57,255,136,.6); font-family: "Courier New", monospace; }
  .overlay.over .title { color: var(--red); text-shadow: 0 0 12px rgba(255,77,109,.6); }
  .overlay .sub { font-size: clamp(12px, 3.5vw, 15px); color: var(--muted); line-height: 1.5; }

  /* 버튼 */
  .controls { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    min-height: 44px;
    border: 1px solid var(--green-dark);
    background: var(--panel);
    color: var(--green);
    font-size: clamp(14px, 3.8vw, 16px);
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: background .12s, transform .08s;
  }
  .btn:hover { background: #17222d; }
  .btn:active { transform: scale(.96); background: #1d2c3a; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--green-dark); color: #04140a; border-color: var(--green); }
  .btn.primary:hover { background: var(--green); }

  /* 터치 방향 버튼 */
  .dpad {
    display: none;
    align-self: center;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
    width: min(64vw, 240px);
    height: min(43vw, 160px);
  }
  .dpad button {
    border: 1px solid var(--green-dark);
    background: var(--panel);
    color: var(--green);
    font-size: 26px;
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
    padding: 0;
  }
  .dpad button:active { background: var(--green-dark); color: #04140a; }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }

  .hint { text-align: center; font-size: 12px; color: var(--muted); }
  .hint.touch { display: none; }

  /* 스마트폰·태블릿(터치 기기 또는 좁은 화면)에서 방향 버튼 표시 */
  @media (pointer: coarse), (max-width: 820px) {
    .dpad { display: grid; }
    .hint.pc { display: none; }
    .hint.touch { display: block; }
  }
  /* 가로 방향(낮은 화면) 스마트폰: 좌우 배치 */
  @media (orientation: landscape) and (max-height: 520px) {
    :root { --board: min(60vh, 70vw); }
    body { align-items: center; }
    .app { width: auto; min-width: 0; display: grid; grid-template-columns: var(--board) 220px; gap: 10px 16px; }
    .app .hud { grid-column: 2; grid-row: 1; flex-direction: column; align-items: stretch; }
    .app .board-wrap { grid-column: 1; grid-row: 1 / span 3; min-width: 0; }
    .app .controls { grid-column: 2; grid-row: 2; flex-wrap: wrap; }
    .app .dpad { grid-column: 2; grid-row: 3; width: 200px; height: 110px; }
    .hint { display: none !important; }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="hud">
      <h1>SNAKE</h1>
      <div class="scores">
        <div class="score-box"><small>SCORE</small><b id="score">0</b></div>
        <div class="score-box"><small>BEST</small><b id="best">0</b></div>
      </div>
    </header>

    <section class="board-wrap" id="boardWrap">
      <canvas id="game" width="600" height="600" aria-label="스네이크 게임 화면"></canvas>
      <div class="overlay" id="overlay">
        <div class="title" id="ovTitle">SNAKE</div>
        <div class="sub" id="ovSub">시작 버튼을 눌러 게임을 시작하세요</div>
      </div>
    </section>

    <div class="controls">
      <button class="btn primary" id="btnStart">시작</button>
      <button class="btn" id="btnPause" disabled>일시정지</button>
      <button class="btn" id="btnRestart">다시 시작</button>
    </div>

    <div class="dpad" id="dpad">
      <button class="up" data-dir="up" aria-label="위">▲</button>
      <button class="left" data-dir="left" aria-label="왼쪽">◀</button>
      <button class="down" data-dir="down" aria-label="아래">▼</button>
      <button class="right" data-dir="right" aria-label="오른쪽">▶</button>
    </div>

    <div class="hint pc">방향키로 이동 · 스페이스바: 시작/일시정지 · R: 다시 시작</div>
    <div class="hint touch">방향 버튼을 누르거나 게임 화면을 스와이프하세요</div>
  </main>

<script>
(() => {
  'use strict';

  const GRID = 20;                 // 20 x 20 격자
  const CELL = 30;                 // 내부 해상도 (600 / 20)
  const TICK_MS = 140;             // 일정한 이동 속도
  const POINTS = 10;               // 먹이 1개당 점수

  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1,  y: 0 }
  };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovSub = document.getElementById('ovSub');
  const btnStart = document.getElementById('btnStart');
  const btnPause = document.getElementById('btnPause');
  const btnRestart = document.getElementById('btnRestart');

  let snake, dir, dirQueue, food, score, best, state, lastTime, acc, rafId;
  // state: 'ready' | 'running' | 'paused' | 'over'

  // 최고 점수 (저장소 사용 불가 환경 대비)
  function loadBest() {
    try { return parseInt(localStorage.getItem('snakeBest'), 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('snakeBest', String(v)); } catch (e) { /* 무시 */ }
  }

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [
      { x: mid,     y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid }
    ];
    dir = 'right';
    dirQueue = [];
    score = 0;
    acc = 0;
    placeFood();
    updateScore();
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    const empty = [];
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        if (!occupied.has(x + ',' + y)) empty.push({ x, y });
      }
    }
    if (empty.length === 0) { food = null; return; }
    food = empty[Math.floor(Math.random() * empty.length)];
  }

  function updateScore() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  /* ---------- 상태 전환 ---------- */
  function showOverlay(title, sub, isOver) {
    ovTitle.textContent = title;
    ovSub.innerHTML = sub;
    overlay.classList.toggle('over', !!isOver);
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  function syncButtons() {
    btnPause.disabled = !(state === 'running' || state === 'paused');
    btnPause.textContent = state === 'paused' ? '계속하기' : '일시정지';
    btnStart.disabled = state === 'running';
    btnStart.textContent = state === 'paused' ? '계속' : '시작';
  }

  function startGame() {
    if (state === 'running') return;
    if (state === 'over') reset();
    if (state === 'paused' || state === 'ready' || state === 'over') {
      state = 'running';
      lastTime = performance.now();
      hideOverlay();
      syncButtons();
    }
  }

  function pauseGame() {
    if (state !== 'running') return;
    state = 'paused';
    showOverlay('일시정지', '시작 또는 계속하기 버튼을 누르면 이어서 진행합니다', false);
    syncButtons();
  }

  function togglePause() {
    if (state === 'running') pauseGame();
    else if (state === 'paused') startGame();
  }

  function restartGame() {
    reset();
    state = 'ready';
    startGame();
  }

  function gameOver(cleared) {
    state = 'over';
    if (score > best) { best = score; saveBest(best); }
    updateScore();
    showOverlay(
      cleared ? 'CLEAR!' : 'GAME OVER',
      '점수: <b>' + score + '</b><br>시작 또는 다시 시작 버튼으로 재도전하세요',
      !cleared
    );
    syncButtons();
  }

  /* ---------- 입력 처리 ---------- */
  function isOpposite(a, b) {
    return DIRS[a].x + DIRS[b].x === 0 && DIRS[a].y + DIRS[b].y === 0;
  }

  function setDirection(name) {
    if (!DIRS[name]) return;
    // 대기 중이거나 끝난 상태에서 방향 입력 시 자동 시작
    if (state === 'ready') startGame();
    if (state !== 'running') return;

    // 큐의 마지막 방향(없으면 현재 방향)을 기준으로 검사
    const ref = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (name === ref) return;                 // 같은 방향 반복 입력 무시
    if (isOpposite(name, ref)) return;        // 즉시 반대 방향(역주행) 무시
    if (dirQueue.length >= 3) return;         // 큐 과적재 방지
    dirQueue.push(name);
  }

  const KEY_MAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right'
  };

  window.addEventListener('keydown', (e) => {
    if (KEY_MAP[e.key]) {
      e.preventDefault();                      // 화면 스크롤 방지
      setDirection(KEY_MAP[e.key]);
      return;
    }
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'running' || state === 'paused') togglePause();
      else startGame();
    } else if ((e.key === 'r' || e.key === 'R') && !e.repeat) {
      restartGame();
    }
  });

  // 터치 방향 버튼 (pointerdown: 빠른 연타에도 즉시 반응)
  document.querySelectorAll('.dpad button').forEach(btn => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      setDirection(btn.dataset.dir);
    });
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  // 게임판 스와이프
  const wrap = document.getElementById('boardWrap');
  let touchStart = null;
  wrap.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  wrap.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
  wrap.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 'right' : 'left');
    else setDirection(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  // 버튼
  btnStart.addEventListener('click', () => { startGame(); btnStart.blur(); });
  btnPause.addEventListener('click', () => { togglePause(); btnPause.blur(); });
  btnRestart.addEventListener('click', () => { restartGame(); btnRestart.blur(); });

  // 탭 전환 시 자동 일시정지
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseGame();
  });

  /* ---------- 게임 로직 ---------- */
  function step() {
    if (dirQueue.length) dir = dirQueue.shift();

    const d = DIRS[dir];
    const head = { x: snake[0].x + d.x, y: snake[0].y + d.y };

    // 벽 충돌
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      return gameOver(false);
    }

    const eating = food && head.x === food.x && head.y === food.y;

    // 자기 몸 충돌 (먹지 않으면 꼬리는 비켜나므로 제외)
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver(false);
    }

    snake.unshift(head);
    if (eating) {
      score += POINTS;
      if (score > best) best = score;
      updateScore();
      placeFood();
      if (!food) return gameOver(true);       // 칸을 모두 채움
    } else {
      snake.pop();
    }
  }

  /* ---------- 렌더링 ---------- */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    const size = GRID * CELL;

    // 배경
    ctx.fillStyle = '#070a0e';
    ctx.fillRect(0, 0, size, size);

    // 체크 무늬 + 격자선
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        if ((x + y) % 2 === 0) {
          ctx.fillStyle = '#0a0f15';
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        }
      }
    }
    ctx.strokeStyle = 'rgba(57,255,136,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < GRID; i++) {
      ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, size);
      ctx.moveTo(0, i * CELL + .5); ctx.lineTo(size, i * CELL + .5);
    }
    ctx.stroke();

    // 먹이
    if (food) {
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      ctx.save();
      ctx.shadowColor = '#ff4d6d';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.arc(cx, cy, CELL * 0.33, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath();
      ctx.arc(cx - 4, cy - 4, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // 뱀
    const pad = 2;
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(snake.length - 1, 1);
      const g = Math.round(255 - t * 85);       // 꼬리로 갈수록 어두운 초록
      ctx.save();
      if (i === 0) { ctx.shadowColor = '#39ff88'; ctx.shadowBlur = 14; }
      ctx.fillStyle = i === 0 ? '#5dffa0' : 'rgb(30,' + g + ',' + Math.round(g * 0.45) + ')';
      roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, i === 0 ? 9 : 7);
      ctx.fill();
      ctx.restore();
    }

    // 뱀 눈
    const h = snake[0];
    const d = DIRS[dir];
    const hx = h.x * CELL + CELL / 2;
    const hy = h.y * CELL + CELL / 2;
    const px = -d.y, py = d.x;                  // 진행 방향의 수직 벡터
    [-1, 1].forEach(sgn => {
      const ex = hx + d.x * 5 + px * 6 * sgn;
      const ey = hy + d.y * 5 + py * 6 * sgn;
      ctx.fillStyle = '#04140a';
      ctx.beginPath();
      ctx.arc(ex, ey, 3, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  /* ---------- 메인 루프 (고정 간격 이동) ---------- */
  function loop(now) {
    if (state === 'running') {
      acc += now - lastTime;
      lastTime = now;
      if (acc > TICK_MS * 5) acc = TICK_MS;     // 긴 지연 후 몰아서 이동 방지
      while (acc >= TICK_MS && state === 'running') {
        acc -= TICK_MS;
        step();
      }
    }
    draw();
    rafId = requestAnimationFrame(loop);
  }

  /* ---------- 초기화 ---------- */
  best = loadBest();
  reset();
  state = 'ready';
  syncButtons();
  showOverlay('SNAKE', '시작 버튼 또는 방향 입력으로<br>게임을 시작하세요', false);
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
